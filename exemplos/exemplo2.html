<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS interno com classe e id</title>
    <!-- CSS Interno dentro do HEAD -->
     <style>
        *{
            background-color: rgb(20, 173, 119);
            margin: 0;
            padding: 0;
        }
        #paragrafo{
            font-size: 25px;
            background-color: red;
            color: white;
            text-align: center;
        }
        #informacoes{
            background-color: blue;
            font-size: 90px;
            text-align: right;
            color: azure;
        }
        .titulo{
            background-color: aqua;
            text-align: unset;
            font-weight: bolder;
        }
        div a{
            color:red;
        }
        div p{
            color: blue;
        }
     </style>
</head>
<body>
    <p id="paragrafo">CSS aplicado no id</p>
    <p id="informacoes">Informações complementares</p>

    <h3 class="titulo">CSS aplicado na classe</h3>
    <p class="titulo">Informações com classe</p>
    <table border="9">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Idade</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td class="titulo">Mateus</td>
                <td>23</td>
            </tr>
        </tbody>
    </table>
    <div>
        <a href="">primeiro link</a>
        <p>qualquer coisa</p>
    </div>
</body>
</html>
